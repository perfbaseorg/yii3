name: PHP CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  php-tests:
    name: PHPStan and PHPUnit on PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    # Yii packages currently declare PHP "8.x - 8.5", so the 8.6 lane installs with
    # --ignore-platform-req=php and is allowed to fail until upstream widens support.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]
        experimental: [false]
        include:
          - php-version: "8.6"
            experimental: true

    steps:
      - name: Checkout yii3
        uses: actions/checkout@v4
        with:
          path: yii3

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer

      - name: Install Perfbase extension
        run: bash -c "$(curl -fsSL https://cdn.perfbase.com/install.sh)"

      - name: Install dependencies
        working-directory: yii3
        run: composer install --prefer-dist --no-progress ${{ matrix.experimental && '--ignore-platform-req=php' || '' }}

      - name: Run PHPStan
        working-directory: yii3
        run: composer run phpstan

      - name: Run PHPUnit
        working-directory: yii3
        run: composer run test
